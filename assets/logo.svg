<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Logo Muhammad Faris">
  <defs>
    <linearGradient id="mfGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="mfGradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="46"
          stroke="url(#mfGrad2)" stroke-width="3" fill="none"
          stroke-linecap="round"
          stroke-dasharray="200 100"
          transform="rotate(30 50 50)"/>

  <!-- Inner filled circle -->
  <circle cx="50" cy="50" r="38" fill="url(#mfGrad2)" fill-opacity="0.15"/>

  <!-- Monogram MF bersambung -->
  <path d="M 20 68
           L 20 32
           L 34 52
           L 48 32
           L 48 68"
        stroke="url(#mfGradText)" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <path d="M 56 68
           L 56 32
           L 78 32
           M 56 50
           L 72 50"
        stroke="url(#mfGradText)" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Dot accent -->
  <circle cx="82" cy="68" r="4" fill="#06b6d4"/>
</svg>